<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ciliphus Point</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<svg class="cursor-trail" data-visible="false" data-moving="false" aria-hidden="true">
  <defs>
    <linearGradient id="cursor-trail-gradient" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c41230" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#0a3161" />
    </linearGradient>
    <g id="sparkler-star">
      <polygon points="0,-7 1.6,-1.6 7,0 1.6,1.6 0,7 -1.6,1.6 -7,0 -1.6,-1.6" />
    </g>
  </defs>
  <path class="cursor-trail__glow" stroke="url(#cursor-trail-gradient)" d=""></path>
  <path class="cursor-trail__line" stroke="url(#cursor-trail-gradient)" d=""></path>
  <circle class="cursor-trail__spark" r="4" cx="0" cy="0"></circle>
  <circle class="cursor-trail__ripple" r="8" cx="0" cy="0"></circle>
  <g class="sparklers"></g>
</svg>
<script src="trail.js"></script>
</body>
</html>
